[project]
name = "cnc-warmup"
version = "0.1.0"
description = "Generate CNC machine warm-up programs for Heidenhain TNC 640 (Klartext) and Fanuc 31i controls"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
cnc-warmup = "cnc_warmup:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "ruff>=0.16.9",
]
