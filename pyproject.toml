[project]
name = "cnc-warmup"
version = "0.1.0"
description = "Generate CNC machine warm-up programs for Heidenhain TNC 640 (Klartext) and Fanuc 31i controls"
requires-python = ">=3.11"
# The generator core is stdlib-only (tomllib needs Python 3.11+).
dependencies = []

[project.scripts]
cnc-warmup = "cnc_warmup.cli:main"

[build-system]
requires = ["uv_build>=0.10.4,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "hypothesis>=6.168.3",
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.9",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle
    "F",       # pyflakes
    "I",       # import sorting
    "B",       # bugbear
    "UP",      # pyupgrade
    "SIM",     # simplify
    "C4",      # comprehensions
    "N",       # pep8 naming
    "PT",      # pytest style
    "PTH",     # prefer pathlib
    "RUF",     # ruff-specific
]

[tool.mypy]
strict = true
python_version = "3.11"
files = ["src", "tests"]

[tool.pytest.ini_options]
minversion = "9.0"
testpaths = ["tests"]
pythonpath = ["tests"]  # shared test helpers, e.g. `import strategies`
addopts = ["-ra", "--strict-markers", "--strict-config", "--import-mode=importlib"]
xfail_strict = true

[tool.coverage.run]
source = ["cnc_warmup"]
branch = true
patch = ["subprocess"]  # also measure `python -m cnc_warmup` runs started by tests

[tool.coverage.report]
show_missing = true
skip_covered = true
# Exhaustiveness guards: mypy proves these unreachable.
exclude_also = ["case _:\\s*\\n\\s*assert_never\\("]
